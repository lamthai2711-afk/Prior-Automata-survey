name: Run 5 Survey E2E Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-surveys:
    runs-on: ubuntu-latest
    steps:
      - name: Send 5 Test Submissions to Pre and Post Survey Google Sheets
        run: |
          python3 - << 'EOF'
          import urllib.request
          import json
          import time

          PRE_URL = "https://script.google.com/macros/s/AKfycbx3zfz5B-dwZjAH1duifmlMdcmJ0kTdAr7X0WjnkK3NxHRqg5gPmaTY_XHmTSnXovjsnA/exec"
          POST_URL = "https://script.google.com/macros/s/AKfycbyrgIJ3C5ejEmf4w7PwIX_ffKXy1n2F_jn3F7tSGT0P4z-quMrUk9PK32_Ai93dbmUQmw/exec"

          test_participants = [
              {"pid": "SZE-TEST01", "neptun": "TEST01", "name": "AUTO TEST 1", "age": 20, "gender": "Male", "standing": "First-year Undergraduate (BSc)", "major": "Computer Science (CS)", "eng": "B2 (Upper-Intermediate)", "prior": "2", "nat": "Hungary"},
              {"pid": "SZE-TEST02", "neptun": "TEST02", "name": "AUTO TEST 2", "age": 21, "gender": "Female", "standing": "Second-year Undergraduate (BSc)", "major": "Software Engineering", "eng": "C1 (Advanced)", "prior": "3", "nat": "Vietnam"},
              {"pid": "SZE-TEST03", "neptun": "TEST03", "name": "AUTO TEST 3", "age": 22, "gender": "Male", "standing": "Third-year or Senior Undergraduate (BSc)", "major": "Business Informatics", "eng": "B2 (Upper-Intermediate)", "prior": "4", "nat": "Czech Republic"},
              {"pid": "SZE-TEST04", "neptun": "TEST04", "name": "AUTO TEST 4", "age": 23, "gender": "Female", "standing": "Graduate / Master's Student (MSc)", "major": "Computer Engineering", "eng": "C1 (Advanced)", "prior": "3", "nat": "Germany"},
              {"pid": "SZE-TEST05", "neptun": "TEST05", "name": "AUTO TEST 5", "age": 21, "gender": "Prefer not to say", "standing": "Second-year Undergraduate (BSc)", "major": "Data Science / AI", "eng": "C2 / Native or Bilingual", "prior": "5", "nat": "Austria"},
          ]

          for i, p in enumerate(test_participants, 1):
              pre_payload = {
                  "participant_id": p["pid"],
                  "neptun_code": p["neptun"],
                  "student_name": p["name"],
                  "consent_confirmed": "yes",
                  "age": str(p["age"]),
                  "gender_identity": p["gender"],
                  "academic_standing": p["standing"],
                  "field_of_study": p["major"],
                  "english_proficiency": p["eng"],
                  "prior_familiarity": p["prior"],
                  "nationality": p["nat"],
                  "pretest_q1": "4",
                  "pretest_q2": "The state transition function",
                  "pretest_q3": "For a given state and input symbol, an NFA can transition to multiple next states (or none), whereas a DFA transitions to exactly one state.",
                  "pretest_q4": "001",
                  "pretest_q5": "{q0, q1, q2}",
                  "time_on_page_seconds": str(120 + i * 15),
                  "ip_address": f"193.224.131.{10+i}",
                  "client_timezone": "Europe/Budapest",
                  "screen_resolution": "1920x1080",
                  "user_agent": "Mozilla/5.0 (GitHub-Actions-E2E-Verifier/1.0)"
              }
              req1 = urllib.request.Request(PRE_URL, data=json.dumps(pre_payload).encode("utf-8"), headers={"Content-Type": "text/plain;charset=utf-8"}, method="POST")
              with urllib.request.urlopen(req1, timeout=30) as resp1:
                  print(f"Pre #{i} ({p['neptun']}):", resp1.status, resp1.read().decode("utf-8"))

              post_payload = {
                  "participant_id": p["pid"],
                  "neptun_code": p["neptun"],
                  "student_name": p["name"],
                  "study_group": "Experimental Group — Interactive Automata Studio (Visual Simulation)" if i % 2 == 1 else "Control Group — Standard Static Lecture Materials / Slides",
                  "post_q1": "Yes, via path q0 -> q0 -> q1 -> q2",
                  "post_q2": "{q0, q1, q2}",
                  "post_q3": "8",
                  "post_q4": "It contains at least one original NFA accepting state",
                  "post_q5": "3",
                  "post_q6": "No, because all paths end in q0 or q1, neither of which is accepting",
                  "post_q7": "{q2, q3}",
                  "post_q8": "Strings of length at least 2 that begin and end with the same symbol",
                  "post_q9": "8 states (2^3), because every subset of {q0, q1, q2} is reachable",
                  "post_q10": "Both strings 'ab' and 'aba'",
                  "post_q11": "2",
                  "post_q12": "{q1, q2, q3}",
                  "post_q13": "All strings over {0, 1} whose 3rd symbol from the end is '1'",
                  "post_q14": "Every NFA can be converted into an equivalent DFA, although the DFA may require up to 2^n states.",
                  "post_q15": "{q0, q2}",
                  "cog_il1": "5", "cog_il2": "5", "cog_il3": "4",
                  "cog_el1": "2", "cog_el2": "1", "cog_el3": "2",
                  "cog_gl1": "6", "cog_gl2": "7", "cog_gl3": "6", "cog_gl4": "7",
                  "imi_1": "6", "imi_2": "7", "imi_3": "6", "imi_4": "6",
                  "imi_5": "7", "imi_6": "6", "imi_7": "7", "imi_8": "7",
                  "pedagogical_feature": f"Automated E2E test #{i}: Parallel state highlighting and step-by-step subset construction table.",
                  "pedagogical_challenge": f"Automated E2E test #{i}: Epsilon-closure propagation across multiple steps.",
                  "course_improvement_feedback": f"Automated E2E test #{i}: Everything worked smoothly.",
                  "time_on_page_seconds": str(420 + i * 25),
                  "ip_address": f"193.224.131.{10+i}",
                  "client_timezone": "Europe/Budapest",
                  "screen_resolution": "1920x1080",
                  "user_agent": "Mozilla/5.0 (GitHub-Actions-E2E-Verifier/1.0)"
              }
              req2 = urllib.request.Request(POST_URL, data=json.dumps(post_payload).encode("utf-8"), headers={"Content-Type": "text/plain;charset=utf-8"}, method="POST")
              with urllib.request.urlopen(req2, timeout=30) as resp2:
                  print(f"Post #{i} ({p['neptun']}):", resp2.status, resp2.read().decode("utf-8"))
              time.sleep(1)
          EOF
